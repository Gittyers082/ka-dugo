<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a0605">
    <title>Account | Ka-dugo Organizer</title>
    <link rel="icon" type="image/x-icon" href="../../assets/icons/kadugo-ico.ico">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/ui.css">
    <script src="../../js/guard.js" data-roles="organizer"></script>
</head>

<body class="ui">
    <div class="shell">
        <aside class="side mobile-logout">
            <a class="side-brand" href="dashboard.html">
                <img src="../../assets/icons/crimson/crimson-logo.svg" alt="Ka-dugo">
                <small>Organizer</small>
            </a>
            <p class="side-label">Workspace</p>
            <nav class="side-nav" aria-label="Organizer navigation">
                <a class="side-link" href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a>
                <a class="side-link" href="drives.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg><span>Drives</span></a>
                <a class="side-link" href="alerts.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9"/><path d="M10 21h4"/></svg><span>Invitations</span></a>
                <a class="side-link is-active" aria-current="page" href="account.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 3.6-6 8-6s7.2 2 8 6"/></svg><span>Account</span></a>
            </nav>
            <div class="side-foot">
                <div class="side-user">
                    <span class="avatar" id="nav-initials" aria-hidden="true"></span>
                    <span><strong id="nav-org"></strong><small>Organizer</small></span>
                </div>
                <a class="side-link logout-link" href="../../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>Logout</span></a>
            </div>
        </aside>

        <main class="main">
            <header class="page-top">
                <div>
                    <p class="eyebrow"><span data-time-greeting></span> • Organization profile</p>
                    <h1>Account</h1>
                </div>
                <div class="page-actions"></div>
            </header>
            <div class="grid grid-split">
                <section class="card">
                    <div class="profile-head">
                        <span class="avatar avatar-lg" id="display-org-initials"></span>
                        <div><h2 id="display-org-name">Loading…</h2><p class="muted" id="display-org-code"></p></div>
                    </div>
                    <dl class="details">
                        <div><dt>Contact person</dt><dd id="display-contact-person">—</dd></div>
                        <div><dt>Email</dt><dd id="display-email">—</dd></div>
                        <div><dt>Contact phone</dt><dd id="display-phone">—</dd></div>
                        <div><dt>Partner banks</dt><dd id="display-blood-bank">—</dd></div>
                    </dl>
                    <div class="toolbar section-gap">
                        <button class="btn btn-primary" id="updateProfileBtn" disabled>Edit contact details</button>
                        <button class="btn btn-ghost" id="changePasswordBtn">Change password</button>
                    </div>
                </section>
                <div class="stack">
                    <div class="stat is-accent"><span class="stat-label">Drives hosted</span><span class="stat-value" id="impact-drives">—</span></div>
                    <div class="stat"><span class="stat-label">Donor registrations</span><span class="stat-value" id="impact-donors">—</span></div>
                </div>
            </div>
        </main>
    </div>
    <dialog class="modal" id="update-profile-dialog">
        <form id="update-profile-form">
            <h2>Contact details</h2>
            <label class="field"><span>Contact person</span><input id="profile-contact-person" maxlength="100" required></label>
            <label class="field"><span>Contact phone</span><input id="profile-contact-no" type="tel" minlength="7" maxlength="20" required></label>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" id="cancel-profile-btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </dialog>
    <dialog class="modal" id="password-dialog">
        <form id="change-password-form">
            <h2>Change password</h2>
            <label class="field"><span>Current password</span><input type="password" id="current-password" autocomplete="current-password" required></label>
            <label class="field"><span>New password (8–72 characters)</span><input type="password" id="new-password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" id="cancel-password-btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Update password</button>
            </div>
        </form>
    </dialog>
    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="../../js/app.js"></script>
    <script type="module" src="../../js/organizer/account.js"></script>
</body>

</html>
