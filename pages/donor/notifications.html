<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a0605">
    <title>Notifications | Ka-dugo Donor</title>
    <link rel="icon" type="image/x-icon" href="../../assets/icons/kadugo-ico.ico">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/ui.css">
    <script src="../../js/guard.js" data-roles="donor"></script>
</head>

<body class="ui">
    <div class="shell">
        <aside class="side">
            <a class="side-brand" href="donor-dashboard.html">
                <img src="../../assets/icons/crimson/crimson-logo.svg" alt="Ka-dugo">
                <small>Donor</small>
            </a>
            <p class="side-label">Workspace</p>
            <nav class="side-nav" aria-label="Donor navigation">
                <a class="side-link" href="donor-dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a>
                <a class="side-link" href="drives-booking.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg><span>Drives</span></a>
                <a class="side-link" href="my-donations.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>Donations</span></a>
                <a class="side-link is-active" aria-current="page" href="notifications.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9"/><path d="M10 21h4"/></svg><span>Alerts</span><span class="side-count" id="nav-unread"></span></a>
                <a class="side-link" href="profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 3.6-6 8-6s7.2 2 8 6"/></svg><span>Profile</span></a>
            </nav>
            <div class="side-foot">
                <div class="side-user">
                    <span class="avatar" id="nav-initials" aria-hidden="true"></span>
                    <span><strong id="nav-org"></strong><small>Donor</small></span>
                </div>
                <a class="side-link logout-link" href="../../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>Logout</span></a>
            </div>
        </aside>

        <main class="main">
            <header class="page-top">
                <div>
                    <p class="eyebrow"><span data-time-greeting></span> • <span id="unread-summary">0 unread</span></p>
                    <h1>Notifications</h1>
                </div>
                <div class="page-actions"><div class="seg" role="group" aria-label="Show">
                    <button type="button" id="show-all-alerts" aria-pressed="true">All</button>
                    <button type="button" id="show-unread-alerts" aria-pressed="false">Unread <span id="unread-tab-count">0</span></button>
                </div>
                <button type="button" class="btn btn-ghost" id="mark-all-alerts-read">Mark all read</button>
                <button type="button" class="icon-btn" id="refresh-notifications" aria-label="Refresh">↻</button></div>
            </header>
            <p class="note is-bad" id="notification-feedback" hidden></p>
            <section class="card">
                <ul class="list" id="donor-notification-list" aria-live="polite"></ul>
                <div class="empty" id="notifications-empty" hidden>
                    <p>No notifications yet.</p>
                    <button type="button" class="btn btn-soft btn-sm section-gap" id="empty-show-all">Show all</button>
                </div>
            </section>
        </main>
    </div>
    <div class="overlay" id="notice-overlay" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="notice-detail-title">
            <span class="pill is-soft no-dot" id="notice-detail-kind"></span>
            <h2 id="notice-detail-title"></h2>
            <p class="muted" id="notice-detail-sender"></p>
            <p id="notice-detail-message"></p>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" id="notice-close">Close</button>
                <button type="button" class="btn btn-ghost" id="notice-done">Done</button>
                <button type="button" class="btn btn-primary" id="notice-go" hidden>Open drive</button>
            </div>
        </div>
    </div>
    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="../../js/app.js"></script>
    <script type="module" src="../../js/donor/donor-notifications.js"></script>
</body>

</html>
