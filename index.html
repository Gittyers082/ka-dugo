<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#660000">
  <title>Ka-dugo | Bank Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Network Status Banner -->
<div id="network-status-bar" class="status-online">Online</div>

<div class="app-container">
  <!-- Sidebar Navigation -->
  <aside class="card-dark" style="width: 250px; border-radius: 0;">
    <div class="text-center mb-2">
      <h1 style="font-size: 2.5rem; line-height: 1;">Ka-<br>dugo</h1>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 15px; margin-top: 50px;">
      <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 20px;">🏠 Home</div>
      <div style="padding: 10px;">📋 Log</div>
      <div style="padding: 10px;">🔲 Scan</div>
      <div style="padding: 10px;">💬 Requests</div>
    </nav>
  </aside>

  <!-- Main Dashboard Area -->
  <main class="main-content">

    <!-- Install PWA Banner -->
    <div id="install-banner-container" style="display: none;">
      <div class="card" style="background-color: var(--dark-maroon); color: white; text-align: center;">
        <p class="mb-1">Find Blood banks near you, even offline</p>
        <button onclick="triggerPWAInstall()" class="btn-primary" style="background-color: white; color: var(--dark-maroon); max-width: 200px;">
          ↓ INSTALL
        </button>
        <div class="mt-1">
          <span onclick="dismissInstallBanner()" style="font-size: 0.8rem; color: #ccc; cursor: pointer;">Not Now</span>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <!-- PWA Offline Sync Card -->
      <div class="card text-center" style="border: 2px solid var(--primary-maroon);">
        <h3 class="text-maroon">PENDING SYNC</h3>
        <h2 id="dashboard-sync-count" style="font-size: 2rem; margin: 10px 0;">0 Records</h2>
        <p class="text-muted" style="font-size: 0.85rem;">Local Queue Secure</p>
      </div>

      <div class="card text-center">
        <h3 class="text-maroon">OPEN REQUESTS</h3>
        <h2 style="font-size: 2rem; margin: 10px 0;">6 Active</h2>
        <p class="text-muted" style="font-size: 0.85rem;">3 urgent protocol</p>
      </div>
    </div>

    <!-- Test Offline Transaction Form -->
    <div class="card mt-2">
      <h3 class="text-maroon mb-2">Scan & Log Donation (PWA Offline Test)</h3>
      <form id="donation-form" onsubmit="handleDonationSubmit(event)">
        <div class="input-group">
          <label for="donor_id">Donor ID</label>
          <input type="text" id="donor_id" placeholder="e.g. BLD-85291" required>
        </div>
        <div class="input-group">
          <label for="weight">Recorded Weight (kg)</label>
          <input type="number" id="weight" placeholder="74" required>
        </div>
        <div class="input-group">
          <label for="blood_type">Blood Type</label>
          <select id="blood_type">
            <option value="O-">O- Universal</option>
            <option value="O+">O+</option>
            <option value="A+">A+</option>
            <option value="B+">B+</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Save & Log Donation</button>
      </form>
    </div>

  </main>
</div>

<!-- PWA Logic Scripts -->
<script src="js/app.js"></script>
<script>
  async function handleDonationSubmit(event) {
      event.preventDefault();

      const formData = {
          donor_id: document.getElementById('donor_id').value,
          weight: document.getElementById('weight').value,
          blood_type: document.getElementById('blood_type').value,
          timestamp: new Date().toISOString()
      };

      const result = await KadugoPWA.submitDonation(formData);

      if (result.status === 'saved') {
          alert('Donation logged successfully to the server!');
      } else if (result.status === 'queued') {
          alert('Saved on this device. It will upload automatically when you are back online.');
      } else {
          alert('Could not save: ' + result.message);
          return;                                   // keep the form filled so the user can fix it
      }
      document.getElementById('donation-form').reset();
  }
</script>
</body>
</html>
