<!DOCTYPE html>
<html lang="en" data-theme="light" data-bank-access="pending">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Active Requests | Ka-dugo Bank</title>
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/bank_css/bank-requests.css">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/kadugo-ico.ico">
    <!-- Hide content until session role check completes. -->
    <style>html[data-bank-access="pending"] body { visibility: hidden; }</style>
    <script src="../../js/pages/bank-access.js" defer></script>
</head>

<body>
    <main class="app-shell">

        <!-- Topbar -->
        <header class="topbar">
            <img class="brand-logo" src="../../assets/icons/crimson/crimson-logo.svg" alt="Ka-dugo" />
            <div class="brand-copy">
                <h1>Active Blood Requests</h1>
                <p>Ka-dugo Bank Management</p>
            </div>
            <button class="refresh" aria-label="Refresh" id="refresh-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2v6h-6"></path>
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 2v6h6"></path>
                </svg>
            </button>
        </header>

        <section class="page-content">

            <!-- Page Header -->
            <header class="page-header flex-between items-center mb-6">
                <div class="flex-row gap-4 items-center">
                    <button class="icon-btn-plain"
                        style="background: transparent; border: 2px solid var(--line); border-radius: 6px; padding: 6px; cursor: pointer;"
                        aria-label="Go Back" onclick="window.location.href='requests.html'">
                        <div>
                            <h2 class="t-title font-heading text-oxblood font-bold m-0">Active Blood Requests</h2>
                            <p class="t-caption text-muted m-0 mt-1">Manage and monitor all open dispatch protocols</p>
                        </div>
                </div>
                <button class="btn-primary bg-maroon text-bone font-bold p-3 px-6"
                    onclick="window.location.href='requests.html'">+ New Request</button>
            </header>

            <!-- Requests Grid -->
            <div class="active-requests-grid" data-request-list aria-live="polite">
                <p class="t-caption text-muted">Loading requests…</p>
            </div>
        </section>

        <!-- Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg></span>
                Home
            </a>
            <a href="donation-log.html" target="_blank">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg></span>
                Log
            </a>
            <a href="scan.html">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg></span>
                Scan
            </a>
            <a class="active" href="requests.html" target="_blank">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1" y="3" width="15" height="13"></rect>
                        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                        <circle cx="5.5" cy="18.5" r="2.5"></circle>
                        <circle cx="18.5" cy="18.5" r="2.5"></circle>
                    </svg></span>
                Requests
            </a>
            <a href="index.html" id="logout-btn" class="logout-link">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </span>
                Logout
            </a>
        </nav>
    </main>
    <script type="module" src="../../js/app.js"></script>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="../../js/pages/account.js"></script>
    <script type="module" src="../../js/pages/bank-active-requests.js"></script>
</body>

</html>
