<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a0605">
    <title>Open requests | Ka-dugo Blood bank</title>
    <link rel="icon" type="image/x-icon" href="../../assets/icons/kadugo-ico.ico">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/ui.css">
    <script src="../../js/guard.js" data-roles="bank"></script>
</head>

<body class="ui">
    <div class="shell">
        <aside class="side mobile-logout">
            <a class="side-brand" href="dashboard.html">
                <img src="../../assets/icons/crimson/crimson-logo.svg" alt="Ka-dugo">
                <small>Blood bank</small>
            </a>
            <p class="side-label">Workspace</p>
            <nav class="side-nav" aria-label="Blood bank navigation">
                <a class="side-link" href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a>
                <a class="side-link" href="donation-log.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span>Donation log</span></a>
                <a class="side-link" href="requests.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg><span>Post request</span></a>
                <a class="side-link is-active" aria-current="page" href="active_requests.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Open requests</span><span class="side-count" id="nav-open-requests"></span></a>
            </nav>
            <div class="side-foot">
                <div class="side-user">
                    <span class="avatar" id="nav-initials" aria-hidden="true"></span>
                    <span><strong id="nav-org"></strong><small>Blood bank</small></span>
                </div>
                <a class="side-link logout-link" href="../../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>Logout</span></a>
            </div>
        </aside>

        <main class="main">
            <header class="page-top">
                <div>
                    <p class="eyebrow"><span data-time-greeting></span> • Most urgent first</p>
                    <h1>Open blood requests</h1>
                </div>
                <div class="page-actions"><a class="btn btn-primary" href="requests.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New request</a></div>
            </header>
            <section class="card">
                <div class="items cols-2" data-request-list aria-live="polite"></div>
            </section>
        </main>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="../../js/app.js"></script>
    <script type="module" src="../../js/bank/active-requests.js"></script>
</body>

</html>
