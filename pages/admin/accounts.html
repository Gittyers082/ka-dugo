<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a0605">
    <title>Accounts | Ka-dugo Admin</title>
    <link rel="icon" type="image/x-icon" href="../../assets/icons/kadugo-ico.ico">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/ui.css">
    <script src="../../js/guard.js" data-roles="admin"></script>
</head>

<body class="ui">
    <div class="shell">
        <aside class="side mobile-logout">
            <a class="side-brand" href="dashboard.html">
                <img src="../../assets/icons/crimson/crimson-logo.svg" alt="Ka-dugo">
                <small>Admin</small>
            </a>
            <p class="side-label">Workspace</p>
            <nav class="side-nav" aria-label="Admin navigation">
                <a class="side-link" href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg><span>Oversight</span></a>
                <a class="side-link is-active" aria-current="page" href="accounts.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c.8-4 3.5-6 7-6s6.2 2 7 6M16 4a4 4 0 0 1 0 8M19 15c1.7.7 2.7 2.7 3 6"/></svg><span>Accounts</span></a>
            </nav>
            <div class="side-foot">
                <div class="side-user">
                    <span class="avatar" id="nav-initials" aria-hidden="true"></span>
                    <span><strong id="nav-org"></strong><small>Admin</small></span>
                </div>
                <a class="side-link logout-link" href="../../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>Logout</span></a>
            </div>
        </aside>

        <main class="main">
            <header class="page-top">
                <div>
                    <p class="eyebrow"><span data-time-greeting></span> • Activate or deactivate sign-ins</p>
                    <h1>Accounts</h1>
                </div>
                <div class="page-actions"></div>
            </header>
            <section class="stats" id="role-tiles"></section>
            <section class="card">
                <div class="card-head"><div><h2>All accounts</h2><p>Deactivating signs the account out on its next request. Accounts are not created here.</p></div></div>
                <form class="toolbar" id="filters" role="search">
                    <label class="search search-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" name="search" placeholder="Search email or name" aria-label="Search accounts"></label>
                    <select name="role" class="select-compact" aria-label="Role">
                        <option value="">All roles</option>
                        <option value="donor">Donor</option>
                        <option value="bank">Blood bank</option>
                        <option value="phlebotomist">Phlebotomist</option>
                        <option value="organizer">Organizer</option>
                        <option value="admin">Admin</option>
                    </select>
                    <select name="sort" class="select-compact" aria-label="Sort">
                        <option value="role:asc">Role</option>
                        <option value="name:asc">Name A–Z</option>
                        <option value="email:asc">Email A–Z</option>
                        <option value="last_login:desc">Last sign-in</option>
                    </select>
                </form>
                <div class="table-wrap section-gap"><table class="table">
                    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last sign-in</th><th>Status</th><th></th></tr></thead>
                    <tbody id="account-rows"></tbody>
                </table></div>
            </section>
        </main>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="../../js/app.js"></script>
    <script type="module" src="../../js/admin/accounts.js"></script>
</body>

</html>
